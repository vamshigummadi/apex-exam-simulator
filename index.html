<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telangana Movement Master Drill (500 MCQs) - Apex Exam Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .palette-btn { width: 36px; height: 32px; font-weight: 600; font-size: 13px; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid #d1d5db; }
        .bg-answered { background-color: #22c55e; color: white; border-color: #16a34a; }
        .bg-not-answered { background-color: #ef4444; color: white; border-color: #dc2626; }
        .bg-marked { background-color: #a855f7; color: white; border-color: #9333ea; }
        .bg-not-visited { background-color: #ffffff; color: #374151; border-color: #cbd5e1; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shadow-sm sticky top-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-emerald-700 rounded flex items-center justify-center text-white font-black text-lg">A</div>
            <span class="font-bold text-slate-800 text-sm hidden sm:inline">Apex Exam Academy</span>
            <span class="text-slate-300">|</span>
            <span class="text-xs sm:text-sm font-semibold text-slate-700">Telangana Movement - 500 MCQ Master Drill (20 Loaded in Session)</span>
        </div>
        <div id="top-timer-bar" class="hidden flex items-center space-x-3">
            <div class="bg-slate-100 px-3 py-1 rounded border border-slate-200 text-xs font-semibold flex items-center gap-1.5">
                <span>Time Left</span>
                <span id="header-countdown" class="bg-slate-800 text-white font-mono px-2 py-0.5 rounded text-xs">00:13:20</span>
            </div>
            <button onclick="toggleFullScreen()" class="px-2.5 py-1 text-xs font-medium border border-slate-300 rounded hover:bg-slate-50">Switch Full Screen</button>
            <button onclick="pauseTest()" class="px-2.5 py-1 text-xs font-medium border border-slate-300 rounded hover:bg-slate-50">Pause</button>
        </div>
    </header>

    <div id="main-app" class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4"></div>

    <script>
        const testData = {
            title: "Telangana Police SI / Constable 2026 - Telangana Movement (Master Set: 500 MCQs Target)",
            durationMins: 13,
            maxMarks: 20,
            positiveMark: 1.0,
            negativeMark: -0.2,
            questions: [
                { id: 1, isPyq: true, pyqYear: "TS SI Prelims 2023", text: "The rare nine-foot Bhairava sculpture recently discovered at Rachakonda Hills in Telangana belongs to which tradition?", options: ["Kakatiya Shaiva tradition", "Post-Kakatiya tantric Bhairava worship", "Chalukya Vaishnava tradition", "Satavahana Buddhist tradition"], correct: 1, explanation: "Reflects post-Kakatiya tantric traditions and warrior practices of the Rachakonda Velamas." },
                { id: 2, isPyq: true, pyqYear: "TS Constable 2022", text: "Which historic agreement was signed on February 20, 1956, between the leaders of Andhra and Telangana to provide safeguards?", options: ["Gentlemen's Agreement (Pedda Manushula Oppandam)", "Sri Bagh Pact", "Eight Point Formula", "Six Point Formula"], correct: 0, explanation: "Signed on February 20, 1956, at Hyderabad House, New Delhi[cite: 1]." },
                { id: 3, isPyq: true, pyqYear: "TSPSC Group-2 2020", text: "The Telangana Movement (1948–2014) is historically categorized into how many major phases?", options: ["Two phases", "Three phases", "Four phases", "Five phases"], correct: 1, explanation: "Divided into Phase I (1948–1970), Phase II (1971–1990), and Phase III (1991–2014)." },
                { id: 4, isPyq: false, text: "In which year did Mir Osman Ali Khan (7th Nizam) issue the historic Firman clarifying Mulki rules and local employment safeguards?", options: ["1911", "1919", "1933", "1948"], correct: 1, explanation: "Mir Osman Ali Khan issued the landmark Firman in 1919 to protect local employment rights." },
                { id: 5, isPyq: true, pyqYear: "TS SI Mains 2019", text: "The 1952 Non-Mulki agitation ('Idli-Sambar Go Back') initially erupted in which district of Hyderabad State?", options: ["Hyderabad", "Warangal", "Karimnagar", "Nizamabad"], correct: 1, explanation: "The movement sparked in Warangal over controversial transfers of local school teachers by divisional inspectors." },
                { id: 6, isPyq: true, pyqYear: "TS Police Constable 2021", text: "Who headed the judicial inquiry committee appointed into the tragic Hyderabad City College police firing of September 3–4, 1952?", options: ["Justice Pingali Jaganmohan Reddy", "Justice Fazal Ali", "Justice J.S. Verma", "Justice K.M. Panikkar"], correct: 0, explanation: "Justice Pingali Jaganmohan Reddy headed the judicial commission investigating the 1952 firing." },
                { id: 7, isPyq: false, text: "When was the States Reorganisation Commission (SRC) under Fazal Ali officially established by the Central Government?", options: ["August 15, 1947", "December 29, 1953", "November 1, 1956", "February 20, 1956"], correct: 1, explanation: "Established on December 29, 1953, with Fazal Ali as Chairman." },
                { id: 8, isPyq: true, pyqYear: "TSPSC Group-1 2022", text: "Which prominent Telangana leaders strongly argued in favor of a separate Telangana state before the SRC in 1954?", options: ["Burgula Ramakrishna Rao & Swami Ramananda Tirtha", "K.V. Ranga Reddy & Marri Chenna Reddy", "Ayyadevara Kaleswara Rao & Bezawada Gopala Reddy", "Puchalapalli Sundarayya & Madapati Hanumantha Rao"], correct: 1, explanation: "K.V. Ranga Reddy and Dr. Marri Chenna Reddy strongly advocated for a separate Telangana state before the SRC." },
                { id: 9, isPyq: false, text: "What was the title of the book written by Dr. B.R. Ambedkar in December 1955 discussing linguistic states?", options: ["Thoughts on Linguistic States", "The Problem of the Greater Andhra", "State Reorganisation and Minorities", "Pakistan or the Partition of India"], correct: 0, explanation: "Published 'Thoughts on Linguistic States' in Dec 1955." },
                { id: 10, isPyq: true, pyqYear: "TS SI Prelims 2018", text: "On which date was the unified state of Andhra Pradesh officially formed by merging Andhra State and Hyderabad State (Telangana)?", options: ["October 1, 1953", "January 26, 1950", "November 1, 1956", "June 2, 2014"], correct: 2, explanation: "Andhra Pradesh was formed on November 1, 1956." },
                { id: 11, isPyq: false, text: "Who became the first Chief Minister of the newly formed united State of Andhra Pradesh in November 1956?", options: ["Burgula Ramakrishna Rao", "Neelam Sanjiva Reddy", "Damodaram Sanjivayya", "Kasuanu Brahmananda Reddy"], correct: 1, explanation: "Neelam Sanjiva Reddy took charge as the first Chief Minister of united Andhra Pradesh." },
                { id: 12, isPyq: true, pyqYear: "TSPSC Group-2 2016", text: "The intense 1969 Jai Telangana agitation officially sparked off with an indefinite hunger strike by whom at Khammam?", options: ["Ravindranath", "Mallikarjuna", "Achyuta Reddy", "Konda Laxman Bapuji"], correct: 0, explanation: "Student leader Ravindranath launched a historic hunger strike at Khammam in January 1969." },
                { id: 13, isPyq: false, text: "Prime Minister Indira Gandhi announced the 'Eight-Point Formula' on which date to address grievances during the 1969 movement?", options: ["April 11, 1969", "January 20, 1969", "September 21, 1973", "December 10, 1970"], correct: 0, explanation: "Announced on April 11, 1969." },
                { id: 14, isPyq: true, pyqYear: "TS SI Mains 2022", text: "Who was the founding President of the Telangana Praja Samithi (TPS) formed during the 1969 movement?", options: ["Dr. Marri Chenna Reddy", "Konda Laxman Bapuji", "Achyuta Reddy", "Madhu Dandavate"], correct: 1, explanation: "Konda Laxman Bapuji was a key founding figure and president of TPS." },
                { id: 15, isPyq: false, text: "In the 1971 Lok Sabha elections, how many parliamentary seats did the Telangana Praja Samithi (TPS) win in the Telangana region?", options: ["6 seats", "8 seats", "10 seats", "14 seats"], correct: 2, explanation: "TPS won 10 out of 14 Lok Sabha seats in Telangana." },
                { id: 16, isPyq: true, pyqYear: "TS Constable 2019", text: "The Six-Point Formula was introduced in 1973 primarily as a political settlement following which major judgment/agitation?", options: ["Jai Andhra and Jai Telangana Movements", "Mulki Rules Supreme Court Judgment (1972)", "Telangana Peasant Armed Struggle", "Hydel Power Agitations"], correct: 1, explanation: "Introduced in 1973 to bypass the Supreme Court's upholding of Mulki Rules." },
                { id: 17, isPyq: false, text: "Which Constitutional Article was inserted through the 32nd Amendment Act, 1973, giving constitutional validity to the Six-Point Formula?", options: ["Article 371", "Article 371(A)", "Article 371(D)", "Article 356"], correct: 2, explanation: "Article 371(D) was added via the 32nd Constitutional Amendment Act, 1973." },
                { id: 18, isPyq: true, pyqYear: "TSPSC Group-2 2017", text: "The Girglani Committee was appointed in 2001 by the Andhra Pradesh government to investigate what issue?", options: ["Water allocation in Krishna-Godavari basins", "Violations of Presidential Orders and G.O. 610 regarding local cadres", "Backwardness of North Telangana districts", "Land reforms implementation"], correct: 1, explanation: "Girglani Committee (2001) investigated violations of Presidential Orders and G.O. 610." },
                { id: 19, isPyq: true, pyqYear: "TS SI Prelims 2022", text: "G.O. 610, issued in August 1985 by the Government of Andhra Pradesh, dealt with which crucial matter?", options: ["Repatriation of non-local employees working in Telangana region to their native zones", "Establishment of agricultural universities in Karimnagar", "Distribution of surplus river waters", "Reservation for women in local bodies"], correct: 0, explanation: "G.O. 610 ordered the repatriation of non-local employees occupying Telangana posts by December 1985." },
                { id: 20, isPyq: true, pyqYear: "TSPSC Group-1 Prelims 2023", text: "On which date was the Telangana Rashtra Samithi (TRS) officially founded by K. Chandrashekar Rao (KCR)?", options: ["April 27, 2001", "November 1, 2000", "June 2, 2014", "December 9, 2009"], correct: 0, explanation: "TRS was officially launched on April 27, 2001, at JVR Park in Hyderabad." }
            ]
        };

        class TestEngine {
            constructor() {
                this.container = document.getElementById('main-app');
                this.state = 'INSTRUCTIONS';
                this.currentQ = 0;
                this.answers = {};
                this.timer = testData.durationMins * 60;
                this.timerInterval = null;
                this.initAnswers();
                this.render();
            }

            initAnswers() {
                testData.questions.forEach((_, idx) => {
                    this.answers[idx] = { selected: null, status: idx === 0 ? 'NOT_ANSWERED' : 'NOT_VISITED' };
                });
            }

            render() {
                if (this.state === 'INSTRUCTIONS') this.renderInstructions();
                else if (this.state === 'RUNNING') this.renderTest();
                else if (this.state === 'RESULT') this.renderResult();
            }

            renderInstructions() {
                document.getElementById('top-timer-bar').classList.add('hidden');
                this.container.innerHTML = `
                    <div class="bg-white rounded border border-slate-200 p-4 sm:p-8 max-w-4xl mx-auto shadow-sm my-4">
                        <h1 class="text-xl sm:text-2xl font-bold text-center text-slate-900 mb-2">${testData.title}</h1>
                        <div class="flex justify-between text-xs font-semibold text-slate-600 border-b pb-3 mb-4">
                            <span>Duration: ${testData.durationMins} Mins</span>
                            <span>Maximum Marks: ${testData.maxMarks}</span>
                        </div>
                        <p class="font-bold text-xs text-slate-800 mb-2">Read the following instructions carefully:</p>
                        <ol class="list-decimal list-inside text-xs text-slate-700 space-y-1.5 mb-6 leading-relaxed">
                            <li>Target pool contains 500 MCQs (Current drill batch: 20 active questions).</li>
                            <li>Each question has 4 options out of which only one is correct.</li>
                            <li>You have to finish the test in ${testData.durationMins} minutes.</li>
                            <li>You will be awarded ${testData.positiveMark} marks for each correct answer and ${testData.negativeMark} negative marking for wrong answers.</li>
                        </ol>
                        <div class="border-t pt-4 space-y-3">
                            <div class="flex items-center gap-2 text-xs">
                                <label class="font-semibold text-slate-700">Choose your default language:</label>
                                <select class="border rounded px-2 py-1 text-xs">
                                    <option>English</option>
                                    <option>Telugu (తెలుగు)</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-2 pt-2">
                                <input type="checkbox" id="decl-check" class="rounded border-slate-300">
                                <label for="decl-check" class="text-xs font-medium text-slate-800">I have understood and agree to all the instructions.</label>
                            </div>
                            <div class="flex justify-between pt-4 border-t">
                                <button class="px-4 py-1.5 bg-sky-200 text-sky-900 font-semibold rounded text-xs">Previous</button>
                                <button onclick="app.startTest()" class="px-6 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded text-xs shadow-sm">I am ready to begin</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            startTest() {
                const check = document.getElementById('decl-check');
                if (!check.checked) { alert('Please accept the declaration before starting.'); return; }
                this.state = 'RUNNING';
                document.getElementById('top-timer-bar').classList.remove('hidden');
                this.startTimer();
                this.render();
            }

            startTimer() {
                this.timerInterval = setInterval(() => {
                    this.timer--;
                    const m = Math.floor(this.timer / 60);
                    const s = this.timer % 60;
                    document.getElementById('header-countdown').innerText = `00:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
                    if (this.timer <= 0) { clearInterval(this.timerInterval); this.submitTest(); }
                }, 1000);
            }

            renderTest() {
                const q = testData.questions[this.currentQ];
                const ans = this.answers[this.currentQ];
                let paletteHtml = testData.questions.map((_, idx) => {
                    const st = this.answers[idx].status;
                    let cls = 'bg-not-visited';
                    if (st === 'ANSWERED') cls = 'bg-answered';
                    else if (st === 'NOT_ANSWERED') cls = 'bg-not-answered';
                    else if (st === 'MARKED') cls = 'bg-marked';
                    return `<button onclick="app.jumpQ(${idx})" class="palette-btn ${cls} ${idx === this.currentQ ? 'ring-2 ring-emerald-600' : ''}">${idx + 1}</button>`;
                }).join('');

                this.container.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
                        <div class="lg:col-span-3 bg-white rounded border border-slate-200 flex flex-col justify-between shadow-sm min-h-[500px]">
                            <div>
                                <div class="border-b px-4 py-2.5 flex justify-between items-center bg-slate-50 text-xs">
                                    <span class="font-bold text-slate-800">Question No. ${this.currentQ + 1} ${q.isPyq ? `<span class="ml-2 text-[10px] bg-amber-500 text-white font-bold px-1.5 py-0.5 rounded">★ PYQ: ${q.pyqYear}</span>` : ''}</span>
                                    <div class="flex items-center space-x-3">
                                        <span class="bg-emerald-600 text-white font-bold px-1.5 py-0.5 rounded text-[10px]">+1</span>
                                        <span class="bg-rose-600 text-white font-bold px-1.5 py-0.5 rounded text-[10px]">-0.2</span>
                                    </div>
                                </div>
                                <div class="p-6 space-y-6">
                                    <p class="text-sm font-medium text-slate-900 leading-relaxed">${q.text}</p>
                                    <div class="space-y-3">
                                        ${q.options.map((opt, oIdx) => `
                                            <label class="flex items-center gap-3 p-3 rounded border border-slate-200 hover:bg-slate-50 cursor-pointer text-xs font-medium">
                                                <input type="radio" name="opt" value="${oIdx}" ${ans.selected === oIdx ? 'checked' : ''} onchange="app.selectOpt(${oIdx})" class="text-emerald-600 focus:ring-emerald-500">
                                                <span>${opt}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                            <div class="border-t px-4 py-3 bg-slate-50 flex flex-wrap justify-between items-center gap-2 text-xs">
                                <div class="flex space-x-2">
                                    <button onclick="app.markReview()" class="px-3 py-1.5 bg-sky-200 hover:bg-sky-300 text-sky-900 font-semibold rounded">Mark for Review & Next</button>
                                    <button onclick="app.clearAns()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded">Clear Response</button>
                                </div>
                                <button onclick="app.saveNext()" class="px-5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded shadow-sm">Save & Next</button>
                            </div>
                        </div>
                        <div class="bg-slate-200/60 rounded border border-slate-300 p-4 space-y-4">
                            <div class="flex items-center gap-3 pb-3 border-b border-slate-300">
                                <div class="w-10 h-10 bg-slate-700 text-white font-bold rounded-full flex items-center justify-center">V</div>
                                <div>
                                    <div class="font-bold text-xs text-slate-800">Vamshidhar</div>
                                    <div class="text-[10px] text-slate-500">Candidate</div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5 text-[10px] text-slate-700 font-semibold">
                                <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-answered rounded-sm"></span> Answered</div>
                                <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-not-answered rounded-sm"></span> Not Answered</div>
                                <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-marked rounded-sm"></span> Marked</div>
                                <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-not-visited border rounded-sm"></span> Not Visited</div>
                            </div>
                            <div class="bg-white p-3 rounded border border-slate-300">
                                <div class="font-bold text-xs text-slate-700 mb-2 border-b pb-1">SECTION : Telangana Movement (500 Target)</div>
                                <div class="grid grid-cols-5 gap-2">${paletteHtml}</div>
                            </div>
                            <button onclick="app.submitTest()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded shadow-sm">Submit Test</button>
                        </div>
                    </div>
                `;
            }

            selectOpt(oIdx) { this.answers[this.currentQ].selected = oIdx; }
            saveNext() {
                const ans = this.answers[this.currentQ];
                if (ans.selected !== null) ans.status = 'ANSWERED'; else ans.status = 'NOT_ANSWERED';
                if (this.currentQ < testData.questions.length - 1) {
                    this.currentQ++;
                    if (this.answers[this.currentQ].status === 'NOT_VISITED') this.answers[this.currentQ].status = 'NOT_ANSWERED';
                }
                this.render();
            }
            markReview() {
                this.answers[this.currentQ].status = 'MARKED';
                if (this.currentQ < testData.questions.length - 1) this.currentQ++;
                this.render();
            }
            clearAns() { this.answers[this.currentQ].selected = null; this.answers[this.currentQ].status = 'NOT_ANSWERED'; this.render(); }
            jumpQ(idx) { this.currentQ = idx; if (this.answers[idx].status === 'NOT_VISITED') this.answers[idx].status = 'NOT_ANSWERED'; this.render(); }
            submitTest() { clearInterval(this.timerInterval); this.state = 'RESULT'; this.render(); }

            renderResult() {
                document.getElementById('top-timer-bar').classList.add('hidden');
                let score = 0, correct = 0, wrong = 0, unattempted = 0;
                testData.questions.forEach((q, idx) => {
                    const ans = this.answers[idx];
                    if (ans.selected === null) unattempted++;
                    else if (ans.selected === q.correct) { correct++; score += testData.positiveMark; }
                    else { wrong++; score += testData.negativeMark; }
                });

                this.container.innerHTML = `
                    <div class="max-w-3xl mx-auto bg-white rounded border border-slate-200 p-6 shadow-sm my-4 space-y-6">
                        <div class="text-center border-b pb-4">
                            <span class="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold text-xs rounded-full">Test Completed</span>
                            <h2 class="text-xl font-bold text-slate-900 mt-2">Performance Summary (500 MCQ Target Track)</h2>
                        </div>
                        <div class="grid grid-cols-4 gap-3 text-center">
                            <div class="p-3 bg-slate-50 rounded border"><div class="text-[11px] text-slate-500">Score</div><div class="text-lg font-bold text-emerald-600">${score.toFixed(1)} / ${testData.maxMarks}</div></div>
                            <div class="p-3 bg-slate-50 rounded border"><div class="text-[11px] text-slate-500">Correct</div><div class="text-lg font-bold text-emerald-600">${correct}</div></div>
                            <div class="p-3 bg-slate-50 rounded border"><div class="text-[11px] text-slate-500">Wrong</div><div class="text-lg font-bold text-rose-600">${wrong}</div></div>
                            <div class="p-3 bg-slate-50 rounded border"><div class="text-[11px] text-slate-500">Mastery Target 500</div><div class="text-lg font-bold text-amber-600">480 Pending</div></div>
                        </div>
                        <div class="space-y-4 pt-2">
                            <h3 class="font-bold text-sm text-slate-800 border-b pb-1">Detailed Solutions</h3>
                            ${testData.questions.map((q, idx) => `
                                <div class="p-4 rounded border ${this.answers[idx].selected === q.correct ? 'border-emerald-200 bg-emerald-50/30' : 'border-rose-200 bg-rose-50/30'} space-y-2 text-xs">
                                    <div class="font-bold text-slate-900">Q${idx + 1}: ${q.text}</div>
                                    <div class="text-slate-600">Your Answer: <strong>${this.answers[idx].selected !== null ? q.options[this.answers[idx].selected] : 'Unattempted'}</strong></div>
                                    <div class="text-emerald-700">Correct Answer: <strong>${q.options[q.correct]}</strong></div>
                                    <div class="text-slate-500 bg-white p-2 rounded border mt-1"><strong>Explanation:</strong> ${q.explanation}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="pt-4 border-t text-center"><button onclick="location.reload()" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded shadow-sm">Retake Test</button></div>
                    </div>
                `;
            }
        }

        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); }
        function pauseTest() { alert('Test Paused. Click OK to resume.'); }
        let app;
        document.addEventListener('DOMContentLoaded', () => { app = new TestEngine(); });
    </script>
</body>
</html>
